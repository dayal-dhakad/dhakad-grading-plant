<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Dhakad Grading Plant — Offline</title>
    <style>
      :root {
        color: #1c1917;
        background: #fff9e8;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        width: min(88vw, 30rem);
        padding: 2.5rem;
        border: 1px solid #d6d3d1;
        border-radius: 1.5rem;
        background: white;
        box-shadow: 0 20px 50px rgb(28 25 23 / 0.12);
        text-align: center;
      }
      h1 {
        margin: 0;
        color: #003f30;
      }
      p {
        margin: 1rem 0 1.5rem;
        color: #57534e;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.8rem 1.25rem;
        border-radius: 0.75rem;
        background: #003f30;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Unable to connect</h1>
      <p>
        Check the internet connection and confirm that the Dhakad Grading Plant server is online.
      </p>
      <a href="https://app.rcpexim.com">Try again</a>
    </main>
  </body>
</html>
